<script>
/* Editable Bible puzzle library. All passages are references, not quoted text. */
const DEFAULT_QUESTIONS = [
['e01','🌧️ 🚢 🦁 🦒 🕊️ 🌈',"Noah’s Ark",['Noah','The flood'],'easy','God asked a man to build a very big boat.','Animals entered the ark, and later a rainbow appeared.','Genesis 6–9','Noah trusted God and built an ark. God kept Noah, his family, and the animals safe through the flood.'],
['e02','🐑 👦 🪨 🎯 🛡️ 👹','David and Goliath',['David defeats Goliath'],'easy','A young shepherd faced a very tall soldier.','David used a sling and a stone.','1 Samuel 17','David trusted God and faced Goliath with a sling and a stone.'],
['e03','🧔 🚢 🌊 🐟 🙏','Jonah and the Great Fish',['Jonah','Jonah and the whale'],'easy','A man tried to travel away from the place God sent him.','He prayed inside a great fish for three days and nights.','Jonah 1–3','God sent a great fish to swallow Jonah. After Jonah prayed, he had another chance to obey God and go to Nineveh.'],
['e04','👶 ⭐ 🐑 👼 🛏️','The Birth of Jesus',['Christmas','Baby Jesus','The Nativity'],'easy','Shepherds heard wonderful news from angels.','Mary laid her baby in a manger in Bethlehem.','Luke 2:1–20; Matthew 2:1–12','Jesus was born in Bethlehem. Angels told shepherds the good news, and wise men later followed a star to worship him.'],
['e05','👨 🙏 🦁 🦁 🌙','Daniel in the Lions’ Den',['Daniel'],'easy','A man kept praying even when a law said he could not.','God sent an angel to shut the lions’ mouths.','Daniel 6','Daniel continued praying to God. God protected him when he was thrown into a den of lions.'],
['e06','🧒 🍞 🍞 🐟 🐟 👥','Jesus Feeds the Five Thousand',['Loaves and fishes','Feeding the 5000'],'easy','A large crowd was hungry.','A boy had five small loaves and two fish.','John 6:1–14','Jesus gave thanks and used a boy’s five loaves and two fish to feed a huge crowd, with food left over.'],
['e07','✝️ 🪨 🌅 🪦 🙌','The Resurrection of Jesus',['Jesus rises from the dead','Easter'],'easy','Women visited a tomb early in the morning.','The stone was moved, and Jesus was alive!','Luke 24:1–12','Jesus rose from the dead. The women found the tomb empty and heard the good news that he was alive.'],
['e08','🐑 🐑 🔍 🧑‍🌾 ❤️','The Lost Sheep',['The good shepherd finds a sheep'],'easy','Jesus told a story about a shepherd looking for one missing animal.','The shepherd left ninety-nine sheep to find this one.','Luke 15:3–7','The shepherd rejoiced when he found his lost sheep. Jesus taught that God rejoices when people turn back to him.'],
['e09','🌍 ☀️ 🌳 🐟 🐦 👨‍👩‍👧','God Creates the World',['Creation','The creation story'],'easy','This story is at the very beginning of the Bible.','God made light, land, plants, animals, and people.','Genesis 1:1–2:3','God created the world and everything in it. God saw that creation was very good and rested on the seventh day.'],
['e10','👨 👩 🌳 🍎 🐍','Adam and Eve',['The Garden of Eden','The fall'],'easy','The first people lived in a beautiful garden.','A serpent tempted them to eat fruit God had told them not to eat.','Genesis 2–3','Adam and Eve disobeyed God in the garden. The Bible calls it fruit; it does not name the kind of fruit.'],
['e11','👶 🧺 🌊 👑 👩','Baby Moses in the Basket',['Baby Moses','Moses in the river'],'easy','A mother hid her baby to protect him.','A princess found his basket among the reeds of the Nile.','Exodus 2:1–10','Moses’ mother placed him in a basket among the reeds. Pharaoh’s daughter found him and cared for him.'],
['e12','🚢 🌊 🌪️ 😴 ✋ ☀️','Jesus Calms the Storm',['Calming the storm'],'easy','The disciples were frightened in a boat.','Jesus spoke to the wind and waves, and they became calm.','Mark 4:35–41','Jesus was asleep when a storm came. He calmed the wind and sea, and the disciples were amazed.'],
['e13','👨 🛣️ 🤕 🫏 ❤️ 🏠','The Good Samaritan',['Good Samaritan'],'easy','A hurt traveler needed someone to help him.','A Samaritan stopped, cared for him, and took him to an inn.','Luke 10:25–37','Jesus told of a Samaritan who cared for a wounded stranger. He taught us to show love and mercy to our neighbors.'],
['e14','👨 🏠 💰 🐖 🔙 🤗','The Lost Son Comes Home',['The prodigal son','The lost son'],'easy','A son went far away and wasted his money.','His father ran to welcome him when he came home.','Luke 15:11–32','Jesus told of a father who joyfully welcomed his returning son. The story shows the joy of forgiveness and returning to God.'],

function begin(g){$('#confetti').replaceChildren();game=g;lastTick=Date.now();save();closeModal();play();tone('start');}
function rec(){return game.records[game.index];}function question(){return game.questions[game.index];}
function play(){screen='play';const q=question(),r=rec(),turn=game.index%game.teams.length,t=game.teams[turn],pts=E.points(game);app.innerHTML=`<div class="game-top"><div><span class="eyebrow">${q.mode==='speed'?'⚡ Speed Round':q.mode==='final'?'🏆 Final Challenge':'THE EMOJI STAGE'}</span><h2>${q.mode==='final'?'All teams, get ready!':`${escape(t.mascot)} ${escape(t.name)}, you’re up!`}</h2></div><div class="progress-group"><span class="pill">Question ${game.index+1} / ${game.questions.length}</span><div class="progress-track" role="progressbar" aria-label="Game progress" aria-valuenow="${game.index+1}" aria-valuemin="0" aria-valuemax="${game.questions.length}"><span style="width:${(game.index+1)/game.questions.length*100}%"></span></div></div></div><div class="game-layout"><div><section class="stage" aria-label="Emoji puzzle">${q.double?'<div class="double-banner">✨ DOUBLE POINTS! ✨</div>':''}${q.mode==='final'?'<div class="double-banner final-banner">🏆 One last challenge. Every team can score!</div>':''}<div class="stage-top"><span class="pill difficulty ${q.difficulty}">${escape(q.difficulty)} · ${q.difficulty==='easy'?'K–2':q.difficulty==='medium'?'3–4':'5–6'}</span><span class="pill">${pts} points ${r.hints?'· '+r.hints+' hint'+(r.hints>1?'s':''):''}</span></div><div class="emoji-puzzle" role="img" aria-label="Emoji puzzle: ${escape(q.emojis)}">${q.emojis.split(/\s+/).map(e=>`<span class="emoji-symbol">${escape(e)}</span>`).join('')}</div>${!r.revealed?`<p class="prompt">${q.mode==='final'?'Teams: discuss, then share your guesses with the teacher.':'Look closely. Which Bible story do you see?'}</p>`:''}${r.hints>=1?`<div class="hint"><b>💡 Hint 1:</b> ${escape(q.hint1)}</div>`:''}${r.hints>=2?`<div class="hint"><b>💡 Hint 2:</b> ${escape(q.hint2)}</div>`:''}${r.revealed?`<div class="answer"><h2>${escape(q.answer)}</h2><div class="reference">📖 ${escape(q.reference)}</div><p>${escape(q.explanation)}</p>${q.alternatives.length?`<p class="alternatives">Also accept: ${q.alternatives.map(escape).join(' · ')}</p>`:''}</div>`:''}<div id="timer-region"></div></section><div class="controls">${btn('hint',`💡 ${r.hints<2?'Show Hint '+(r.hints+1):'Both hints shown'}`,'ghost',r.hints>=2||r.revealed)}${btn('reveal',r.revealed?'✓ Answer Revealed':'✨ Reveal Answer','primary',r.revealed)}${btn('skip','Skip Question →','ghost',game.index===game.questions.length-1&&r.revealed)}</div>${r.revealed?`<section class="award-box" aria-label="Award points"><label for="award-team">${q.mode==='final'?'Award each correct team separately':'Which team got it right?'} · ${pts} points</label><select id="award-team">${game.teams.map((t,i)=>`<option value="${i}" ${i===turn?'selected':''}>${escape(t.mascot)} ${escape(t.name)}${r.awarded.includes(i)?' · Awarded ✓':''}</option>`).join('')}</select><div class="button-row">${btn('correct','✓ Correct · Award Points','good',r.settled)}${btn('incorrect',q.mode==='final'?'Finish judging':'✕ Incorrect · 0 points','ghost',r.settled)}${btn('next',game.index===game.questions.length-1?'🎉 Finish Game':'Next Question →','primary')}</div><p class="status-line" role="status">${r.awarded.length?`✓ Awarded to ${r.awarded.map(i=>escape(game.teams[i].name)).join(', ')}. ${q.mode==='final'&&!r.settled?'Choose another correct team above.':''}`:r.settled?'No points awarded. Ready for the next question.':'Teacher: accept spoken answers, then choose a result.'}</p></section>`:''}</div><aside class="scoreboard" aria-label="Team scores"><div class="leaderboard-label">🏅 TEAM SCOREBOARD</div>${game.teams.map((t,i)=>`<div class="team-panel ${i===turn&&q.mode!=='final'?'active':''}" style="--team:${t.color}" data-team-panel="${i}"><div class="team-name">${escape(t.mascot)} ${escape(t.name)}</div><div class="team-score">${t.score.toLocaleString()}</div><div class="score-label">POINTS${i===turn&&q.mode!=='final'?' · YOUR TURN':''}</div>${btn('adjust','± Score','small',false,`data-team="${i}" aria-label="Adjust ${escape(t.name)} score"`)}</div>`).join('')}</aside></div><div class="teacher-strip"><div class="button-row">${btn('previous','← Previous','ghost small',game.index===0)}${btn('undo','↶ Undo Score','ghost small',!game.history.length)}${btn('reset-scores','Reset Scores','ghost small')}</div><div class="button-row">${btn('home','⌂ Home / Save','ghost small')}${btn('end','End Game','danger small')}</div></div>`;updateTimer();updateSound();}
function timerDuration(){const q=question();return q.mode==='speed'?Math.min(15,Number(game.settings.timer)||15):Number(game.settings.timer);}
function updateTimer(){const el=$('#timer-region');if(!el||!game)return;const r=rec(),duration=timerDuration();if(!duration){if(!el.firstChild)el.innerHTML='<p class="muted" style="margin:12px 0 0">Timer off · Take your time.</p>';return;}
 if(!el.querySelector('.timer-area'))el.innerHTML=`<div class="timer-area"><span class="timer-number" aria-label="Seconds remaining"></span><div class="timer-track"><div class="timer-fill"></div></div>${btn('pause','Ⅱ Pause','ghost small')}</div><p class="time-up" role="status" hidden>⏰ Time’s up! Teacher, you decide what happens next.</p>`;
 el.querySelector('.timer-area').classList.toggle('warning',r.remaining<=5&&!r.expired&&!r.revealed);
 el.querySelector('.timer-number').textContent=Math.max(0,Math.ceil(r.remaining));
 el.querySelector('.timer-fill').style.width=Math.max(0,r.remaining)/duration*100+'%';
 const pause=el.querySelector('[data-action="pause"]');pause.textContent=r.paused?'▶ Resume':'Ⅱ Pause';pause.disabled=r.expired||r.revealed;
 el.querySelector('.time-up').hidden=!r.expired;
}
function navigate(delta){const next=game.index+delta;if(next>=game.questions.length){finish();return;}if(next<0)return;game.index=next;lastTick=Date.now();save();play();if(question().double)tone('start');}
function finish(){game.complete=true;save();screen='end';endScreen();confetti();tone('win');}
function endScreen(){screen='end';const ranks=E.rankings(game),winners=ranks.filter(t=>t.rank===1);app.innerHTML=`<section class="celebration"><p class="eyebrow">WHAT A WONDERFUL ADVENTURE</p><div class="trophy" aria-hidden="true">🏆</div><h1>🎉 GAME COMPLETE! 🎉</h1><p class="winner">${winners.map(t=>escape(t.mascot)+' '+escape(t.name)).join(' & ')} ${winners.length>1?'share the win!':'wins!'}</p><p class="muted">Great teamwork, big smiles, and more Bible stories to remember.</p><div class="rankings">${ranks.map(t=>`<div class="rank-row" style="--team:${t.color}"><span class="rank">${t.rank===1?'🥇':t.rank===2?'🥈':t.rank===3?'🥉':'#'+t.rank}</span><span>${escape(t.mascot)} ${escape(t.name)}</span><strong>${t.score.toLocaleString()}<span class="sr-only"> points</span></strong></div>`).join('')}</div><div class="hero-actions">${btn('again','↻ Play Again','primary')}${btn('setup','New Game','good')}${btn('home','Return Home','ghost')}</div><p class="saved-note">Play Again uses your teams and settings with a fresh question order.</p></section>`;}
function showSettings(){openModal('Game settings',`<p>These choices apply to new games. Sound options change immediately after saving.</p><form id="settings-form">${settingsFields(settings)}<h3>Sound studio · optional</h3>${[['sound','Sound effects'],['music','Gentle background music'],['ticking','Timer ticking during the last 5 seconds']].map(([k,l])=>`<label class="check-label"><input type="checkbox" name="${k}" ${settings[k]?'checked':''}> ${l}</label>`).join('')}<small>Sounds are generated on your device. Use the top Sound button to mute everything.</small><div class="button-row"><button type="submit" class="primary">Save Settings</button>${btn('close-modal','Cancel','ghost')}</div></form>`);}
function help(){openModal('How to play',`<ol><li>Make 2–4 teams. Choose the difficulty, timer, and number of questions.</li><li>Teams take turns guessing the Bible story shown by the emojis. Keep answers verbal; no typing needed.</li><li>Use hints if a team gets stuck. A correct answer earns <b>100 points</b>, or <b>70 after one hint</b> and <b>40 after two</b>.</li><li>Reveal the answer, choose the team that earned it, and press <b>Correct</b>. Another team can earn the points. Incorrect earns 0.</li><li>The timer never marks an answer wrong. Pause whenever you need more discussion.</li><li>The final challenge lets <b>every correct team</b> earn points once. Double points multiply the current hint score. Speed round is five quick puzzles.</li></ol><p>Previous questions keep their hints and scoring. Undo reverses the latest scoring action, including manual adjustments. Home saves your game. After a refresh, select Continue and Resume the timer.</p><h3>Keyboard shortcuts</h3><div class="shortcut-grid"><span><kbd>R</kbd> Reveal answer</span><span><kbd>H</kbd> Show hint</span><span><kbd>Space</kbd> Pause / resume timer</span><span><kbd>→</kbd> Next (after reveal)</span><span><kbd>←</kbd> Previous</span><span><kbd>S</kbd> Skip question</span><span><kbd>U</kbd> Undo score</span><span><kbd>F</kbd> Fullscreen</span></div><p>Shortcuts are disabled while typing or when a dialog is open. All controls also work by touch.</p>${btn('close-modal','Got it!','primary')}`);}
let search='',filter='all';
function libraryScreen(){screen='library';app.innerHTML=`<div class="section-heading"><div><p class="eyebrow">YOUR TEACHER TOOLKIT</p><h2>Question Library</h2></div>${btn('home','← Home','ghost')}</div><p class="muted">Preview, personalize, and add stories for your class. Changes apply to new games; your current game keeps its own copy.</p><div class="library-toolbar"><label class="sr-only" for="library-search">Search stories or characters</label><input id="library-search" type="search" placeholder="🔍 Search stories, characters, or references…" value="${escape(search)}"><label class="sr-only" for="library-filter">Difficulty filter</label><select id="library-filter">${options([['all','All difficulties'],['easy','Easy · K–2'],['medium','Medium · 3–4'],['hard','Hard · 5–6']],filter)}</select></div><div class="button-row">${btn('add-question','＋ Add Puzzle','primary')}${btn('export','↓ Export JSON','ghost')}${btn('import','↑ Import JSON','ghost')}${btn('reset-library','Reset to Defaults','ghost')}</div><div id="library-results"></div>`;renderLibraryResults();}
function renderLibraryResults(){const list=library.filter(q=>(filter==='all'||q.difficulty===filter)&&[q.answer,q.reference,...q.alternatives].join(' ').toLowerCase().includes(search.toLowerCase()));$('#library-results').innerHTML=`<p class="saved-note">${list.length} of ${library.length} puzzles · ${library.filter(q=>q.enabled).length} enabled</p><div class="library-grid">${list.map(q=>`<article class="library-card ${q.enabled?'':'disabled'}"><span class="pill difficulty ${q.difficulty}">${q.difficulty}${q.custom?' · Custom':''}</span><div class="preview">${escape(q.emojis)}</div><h3>${escape(q.answer)}</h3><p>${escape(q.reference)}</p><div class="button-row">${btn('edit-question','Preview / Edit','small',false,`data-id="${escape(q.id)}"`)}<label class="check-label"><input type="checkbox" data-enable="${escape(q.id)}" ${q.enabled?'checked':''}> Enabled</label></div></article>`).join('')}</div>${!list.length?'<p class="empty">No puzzles match. Try another search or add your own.</p>':''}`;}
let editingId=null;
function editQuestion(id){const q=library.find(q=>q.id===id)||{id:'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),emojis:'',answer:'',alternatives:[],difficulty:'easy',hint1:'',hint2:'',reference:'',explanation:'',enabled:true,custom:true};editingId=q.id;openModal(id?'Preview & edit puzzle':'Create a puzzle',`<div class="preview" style="font-size:2.7rem;text-align:center" id="editor-preview">${escape(q.emojis)||'✨ 📖 ✨'}</div><form id="question-form"><div class="edit-grid"><label class="wide">Emoji puzzle<input name="emojis" value="${escape(q.emojis)}" maxlength="200" required></label><label class="wide">Correct answer<input name="answer" value="${escape(q.answer)}" maxlength="200" required></label><label class="wide">Alternative answers (separate with semicolons)<input name="alternatives" value="${escape(q.alternatives.join('; '))}" maxlength="1000"></label><label>Difficulty<select name="difficulty">${options([['easy','Easy'],['medium','Medium'],['hard','Hard']],q.difficulty)}</select></label><label>Bible reference<input name="reference" value="${escape(q.reference)}" maxlength="200" required></label><label class="wide">Hint 1<textarea name="hint1" maxlength="1000" required>${escape(q.hint1)}</textarea></label><label class="wide">Hint 2 (more helpful)<textarea name="hint2" maxlength="1000" required>${escape(q.hint2)}</textarea></label><label class="wide">Child-friendly explanation<textarea name="explanation" maxlength="2000" required>${escape(q.explanation)}</textarea></label></div><label class="check-label"><input name="enabled" type="checkbox" ${q.enabled?'checked':''}> Enable in new games</label><small>ID: ${escape(q.id)}</small><div class="button-row"><button class="primary" type="submit">Save Puzzle</button>${btn('close-modal','Cancel','ghost')}${q.custom&&id?btn('delete-question','Delete Custom Puzzle','danger',false,`data-id="${escape(q.id)}"`):''}</div></form>`);}
function saveQuestion(form){const fd=new FormData(form);const previous=library.find(q=>q.id===editingId);const q={id:editingId,custom:previous?previous.custom:true,enabled:fd.has('enabled'),alternatives:String(fd.get('alternatives')).split(';').map(s=>s.trim()).filter(Boolean)};for(const k of ['emojis','answer','difficulty','reference','hint1','hint2','explanation'])q[k]=String(fd.get(k)).trim();try{const checked=E.validateLibrary([q])[0];if(previous)library[library.indexOf(previous)]=checked;else library.push(checked);store(KEYS.library,library);closeModal();libraryScreen();toast('Puzzle saved.');}catch(err){toast(err.message);}}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function importModal(){openModal('Import question library',`<p>Choose a JSON backup. Importing replaces your library after validation. Export first if you want to keep your current edits. Saved games are kept.</p><label>JSON backup file<input id="import-file" class="file-input" type="file" accept=".json,application/json"></label>${btn('close-modal','Cancel','ghost')}`);}
let pendingImport=null;
async function readImport(file){if(!file)return;if(file.size>2*1024*1024){toast('Choose a JSON backup smaller than 2 MB.');return;}try{const parsed=JSON.parse(await file.text());pendingImport=E.validateLibrary(parsed);confirmAction('Replace your question library?',`${pendingImport.length} valid puzzles are ready to import. This replaces your current question library. Export a backup before continuing if needed.`,'confirm-import','Replace Library');}catch(err){toast('Import failed: '+err.message);}}
function adjustModal(i){openModal('Adjust team score',`<p>${escape(game.teams[i].mascot)} ${escape(game.teams[i].name)} · ${game.teams[i].score} points</p><form id="adjust-form" data-team="${i}"><label>Points to add or subtract<input name="delta" type="number" step="1" min="-1000000" max="1000000" value="100" required></label><small>Use a negative number to subtract. Undo can reverse this adjustment.</small><div class="button-row"><button type="submit" class="primary">Apply Adjustment</button>${btn('close-modal','Cancel','ghost')}</div></form>`);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('For a larger view, use your browser’s full-screen or Hide Toolbar option.');}catch{toast('Fullscreen is unavailable here. Use your browser’s full-screen option.');}}
function unlockAudio(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});}
function note(freq,duration=.15,volume=.035,delay=0){if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=freq;o.connect(gain);gain.connect(audio.destination);const now=audio.currentTime+delay;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(volume,now+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);o.start(now);o.stop(now+duration+.02);}
function tone(type){if(!settings.sound)return;unlockAudio();if(type==='tick')note(580,.05,.012);else if(type==='time')note(220,.45);else{const notes=type==='win'?[523,659,784,1046]:type==='correct'?[523,659,784]:[440,554,659];notes.forEach((n,i)=>note(n,.25,.04,i*.12));}}
function updateSound(){$('#sound').textContent=settings.sound?'🔊 Sound on':'🔇 Sound off';$('#sound').setAttribute('aria-pressed',String(settings.sound));}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const host=$('#confetti');for(let i=0;i<65;i++){const el=document.createElement('i');el.className='confetto';el.style.left=Math.random()*100+'%';el.style.background=[...palettes,'#caa6ff'][i%5];el.style.animationDelay=Math.random()*.5+'s';el.style.animationDuration=2+Math.random()*1.4+'s';host.append(el);setTimeout(()=>el.remove(),4000);}}
function bump(i){const panel=document.querySelector(`[data-team-panel="${i}"]`);if(panel)panel.classList.add('bump');}
function act(action,el){
 if(action==='close-modal'){closeModal();return;}
 if(action==='home'){if(screen==='play'){rec().paused=true;save();}home();return;}
 if(action==='help'){help();return;}if(action==='settings'){showSettings();return;}if(action==='fullscreen'){fullscreen();return;}
 if(action==='setup'){teamCount=4;setup();return;}
 if(action==='continue'&&game){game.complete?endScreen():play();lastTick=Date.now();return;}
 if(action==='confirm-start'){begin(window.pendingGame);delete window.pendingGame;return;}
 if(action==='library'){libraryScreen();return;}
 if(action==='add-question'){editQuestion(null);return;}if(action==='edit-question'){editQuestion(el.dataset.id);return;}
 if(action==='export'){download(JSON.stringify(library,null,2),'bible-emoji-library.json','application/json');return;}
 if(action==='import'){importModal();return;}
 if(action==='confirm-import'){library=pendingImport;pendingImport=null;store(KEYS.library,library);closeModal();libraryScreen();toast('Library imported.');return;}
 if(action==='reset-library'){confirmAction('Reset question library?','This removes custom puzzles and edits, and restores the 40 original questions. Export a backup first if needed.','confirm-reset-library','Reset Library');return;}
 if(action==='confirm-reset-library'){library=E.copy(DEFAULT_QUESTIONS);store(KEYS.library,library);closeModal();libraryScreen();return;}
 if(action==='delete-question'){const id=el.dataset.id;confirmAction('Delete custom puzzle?','This permanently removes this custom puzzle from your library.','confirm-delete','Delete Puzzle');$('#modal-body').dataset.deleteId=id;return;}
 if(action==='confirm-delete'){library=library.filter(q=>q.id!==$('#modal-body').dataset.deleteId||!q.custom);store(KEYS.library,library);closeModal();libraryScreen();return;}
 if(action==='again'){try{begin(E.makeGame(library,game.teams,game.settings));}catch(err){toast(err.message);}return;}
 if(!game||screen!=='play')return;
 const r=rec();
 switch(action){
 case 'hint':if(r.hints<2&&!r.revealed){r.hints++;save();play();}break;
 case 'reveal':if(!r.revealed){r.revealed=true;r.paused=true;save();play();tone('start');}break;
 case 'pause':if(!r.expired&&!r.revealed){r.paused=!r.paused;lastTick=Date.now();save();updateTimer();}break;
 case 'next':navigate(1);break;
 case 'skip':if(game.index===game.questions.length-1)confirmAction('Finish the game?','This is the last puzzle. Finish without awarding points for this question?','confirm-end','Finish Game');else{r.skipped=true;navigate(1);}break;
 case 'previous':navigate(-1);break;
 case 'correct':{const team=Number($('#award-team').value);if(E.award(game,team)){save();play();bump(team);tone('correct');if(question().mode==='final')confetti();}else toast('This team or question has already been scored. Use Undo Score to reverse the last award.');break;}
 case 'incorrect':if(E.incorrect(game)){save();play();}break;
 case 'undo':if(E.undo(game)){lastTick=Date.now();save();play();toast('Latest score action undone.');}break;
 case 'adjust':adjustModal(Number(el.dataset.team));break;
 case 'reset-scores':confirmAction('Reset every team’s score?','All team totals will become zero. Judged questions stay judged. Undo Score can reverse this reset.','confirm-reset-scores','Reset Scores');break;
 case 'confirm-reset-scores':E.resetScores(game);save();closeModal();play();break;
 case 'end':confirmAction('End this game?','Show the final rankings and celebrate the current scores?','confirm-end','End Game');break;
 case 'confirm-end':closeModal();finish();break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){unlockAudio();act(el.dataset.action,el);}});
$('#brand').addEventListener('click',e=>{e.preventDefault();act('home');});$('#settings').onclick=showSettings;$('#help').onclick=help;$('#fullscreen').onclick=fullscreen;
$('#sound').onclick=()=>{unlockAudio();settings.sound=!settings.sound;store(KEYS.settings,settings);updateSound();if(settings.sound)tone('correct');};
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;unlockAudio();if(form.id==='setup-form')startGame();if(form.id==='settings-form'){settings=getSettings(form);for(const k of ['sound','music','ticking'])settings[k]=new FormData(form).has(k);store(KEYS.settings,settings);closeModal();updateSound();if(screen==='setup'){captureTeams();setup();}toast('Settings saved. Game choices apply to new games.');}if(form.id==='question-form')saveQuestion(form);if(form.id==='adjust-form'){if(E.adjust(game,Number(form.dataset.team),Number(form.elements.delta.value))){save();closeModal();play();}else toast('Enter a valid whole-number adjustment.');}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='team-count'){captureTeams();settings=getSettings($('#setup-form'));teamCount=Number(el.value);setup();}if(el.id==='library-filter'){filter=el.value;renderLibraryResults();}if(el.dataset.enable){const q=library.find(q=>q.id===el.dataset.enable);q.enabled=el.checked;store(KEYS.library,library);renderLibraryResults();}if(el.id==='import-file')readImport(el.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){search=e.target.value;renderLibraryResults();}if(e.target.name==='emojis'&&$('#editor-preview'))$('#editor-preview').textContent=e.target.value;});
document.addEventListener('keydown',e=>{if(modal.open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,button,[contenteditable="true"]'))return;const keys={r:'reveal',h:'hint',' ':'pause',ArrowRight:'next',ArrowLeft:'previous',s:'skip',u:'undo',f:'fullscreen'};const action=keys[e.key]||keys[e.key.toLowerCase()];if(!action)return;if(action==='fullscreen'){e.preventDefault();fullscreen();return;}if(screen!=='play')return;if(action==='next'&&!rec().revealed)return;e.preventDefault();act(action);});
modal.addEventListener('close',()=>{lastTick=Date.now();});
document.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(document.hidden&&game&&screen==='play'){rec().paused=true;save();updateTimer();}});
window.addEventListener('pagehide',save);
setInterval(()=>{const now=Date.now(),elapsed=(now-lastTick)/1000;lastTick=now;if(screen!=='play'||!game||modal.open||document.hidden)return;const r=rec();if(!timerDuration()||r.paused||r.revealed||r.expired)return;const before=Math.ceil(r.remaining);r.remaining=Math.max(0,r.remaining-elapsed);const after=Math.ceil(r.remaining);if(before!==after){save();if(after>0&&after<=5&&settings.ticking)tone('tick');}if(r.remaining===0){r.expired=true;r.paused=true;save();tone('time');}updateTimer();},250);
setInterval(()=>{if(settings.sound&&settings.music&&screen==='play'&&!modal.open&&!document.hidden){note([261.63,329.63,392,329.63,293.66,349.23,440,349.23][musicBeat++%8],.6,.009);}},650);
updateSound();home();
})();

</script>
</body></html>
